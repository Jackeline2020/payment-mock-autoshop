name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

env:
  IMAGE_NAME: autoshop-payment-mock

jobs:
  test:
    name: Build + Testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Baixar dependências
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Análise estática (go vet)
        run: go vet ./...

      - name: Testes com cobertura
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Verificar cobertura mínima (80%)
        run: ./scripts/coverage.sh

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push:
    name: Build da Imagem Docker
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.full }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem (minúsculo, exigido pelo registry)
        id: image
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "full=ghcr.io/${OWNER_LOWER}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.full }}

  # Deploy no cluster EKS, só na main e com a variável AWS_DEPLOY_ENABLED
  # ligada (fica desligada enquanto a infraestrutura não existe). Autentica
  # na AWS por OIDC, sem chave fixa, e aplica os manifestos de k8s/.
  deploy-aws:
    name: Deploy Produção (EKS)
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Apontar o kubectl para o cluster EKS
        run: aws eks update-kubeconfig --region us-east-1 --name autoshop-eks

      - name: Aplicar manifestos e aguardar o rollout
        env:
          SERVICE: autoshop-payment-mock
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          RUN_MIGRATIONS: "false"
        run: sh ./scripts/deploy-aws.sh
